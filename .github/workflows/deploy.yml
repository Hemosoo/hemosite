name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      # The same source tree serves two sites. The production repo publishes
      # what the build produced; the preview repo takes the identical build and
      # only changes where it says it lives, so a preview is never a different
      # build from the one that will go live — which is the entire point of
      # having somewhere to look at it first.
      - name: Point a preview build at the preview domain
        if: github.repository != 'Hemosoo/hemosite'
        run: |
          echo staging.hemosoo.com > dist/CNAME
          # Kept out of search results, so the preview cannot outrank or be
          # mistaken for the real site. The canonical tag still names
          # hemosoo.com, which is the right answer for anything that follows it.
          sed -i 's|<head>|<head>\n    <meta name="robots" content="noindex, nofollow" />|' dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
